return h+'<div class="card"><div class="mu">Difficulté ressentie : <b id="rv">'+r.rpe+'</b>/10</div><input type="range" min="1" max="10" value="'+r.rpe+'" data-r="rpe" style="width:100%"><textarea data-r="com" placeholder="Commentaire (facultatif)" style="width:100%;margin-top:8px;min-height:60px">'+r.com+'</textarea><input data-r="pain" placeholder="Douleur ou gêne à signaler (facultatif)" value="'+r.pain+'" style="width:100%;margin-top:8px"></div><button class="btn" data-a="fin">Terminer ma séance</button><div style="height:30px"></div>'}
function det(d){const x=st.done[d];let h='<div class="ovh"><b>'+fd(d,{weekday:"long",day:"numeric",month:"long",year:"numeric"})+'</b><button class="ib" data-a="cs">Fermer</button></div>';
if(!x)return h+'<div class="card mu">'+(pl(d)!==null?"Séance prévue : "+sn(pl(d)):"Repos")+"</div>";
h+='<div class="card"><h2>'+sn(x.s)+"</h2>"+(x.old?'<div class="mu">Séance importée de l’ancienne version (sans détail).</div>':'<div class="mu">'+x.dur+" min · "+x.pct+"% réalisé · difficulté "+x.rpe+"/10</div>"+(x.pain?'<div style="margin-top:6px">⚠ '+x.pain+"</div>":"")+(x.com?'<div class="mu" style="margin-top:6px">'+x.com+"</div>":""))+"</div>";
return h+(x.ex||[]).map(e=>'<div class="card"><b>'+e.n+'</b><div class="mu">'+e.t+" → "+e.sets.map(s=>(s.v||"–")+(e.hold?" s":"")+(s.ok?"":"?")).join(" · ")+"</div></div>").join("")}
const A={tab:v=>{tab=v;scrollTo(0,0)},ts:v=>tsub=v,cv:v=>cv=v,ps:v=>psub=v,pw:v=>pw=+v,ph:v=>st.ph=+v,cm:v=>cm.setMonth(cm.getMonth()+ +v),nd:v=>nd=add(nd,+v),
gow:()=>{tab="p";psub="w";scrollTo(0,0)},hd:v=>{sheet=det(v);scrollTo(0,0)},cs:()=>{sheet=null},
mvs:()=>{const d=$("mv").value;if(d&&d>=today)st.base.d=d},
start:v=>{const i=st.base.i,r={i,d:v,ex:[],t0:Date.now(),cur:0,rpe:5,com:"",pain:""};S[i][1].forEach(e=>{const t=e[st.ph];if(t=="—")return;r.ex.push({n:e[0],t,rest:e[4],hold:/\d\s?s\b/.test(t),sets:Array.from({length:nsets(t)},()=>({v:"",ok:0}))})});st.run=r},
rq:()=>{if(confirm("Quitter sans enregistrer cette séance ?")){st.run=null;tm=null}},
sk:v=>{const[a,b]=v.split(":").map(Number),e=st.run.ex[a],s=e.sets[b];s.ok=s.ok?0:1;st.run.cur=a;if(s.ok)tm={m:"r",end:Date.now()+e.rest*1e3}},
tr:()=>{const e=st.run.ex[st.run.cur]||st.run.ex[0];tm={m:"r",end:Date.now()+(e?e.rest:90)*1e3}},
th2:()=>{const r=st.run;if(tm&&tm.m=="h"){const s=Math.round((Date.now()-tm.t0)/1e3);let ei=r.ex[r.cur]&&r.ex[r.cur].hold?r.cur:r.ex.findIndex(e=>e.hold&&e.sets.some(x=>x.v===""));const e=r.ex[ei];if(e){const x=e.sets.find(y=>y.v==="");if(x)x.v=s}tm=null}else tm={m:"h",t0:Date.now()}},
fin:()=>{const r=st.run;if(!confirm("Terminer et enregistrer cette séance ?"))return;let T=0,K=0;r.ex.forEach(e=>e.sets.forEach(s=>{T++;K+=s.ok}));st.done[r.d]={s:r.i,dur:Math.max(1,Math.round((Date.now()-r.t0)/6e4)),rpe:r.rpe,com:r.com,pain:r.pain,pct:T?Math.round(K/T*100):0,ex:r.ex.map(e=>({n:e.n,t:e.t,hold:e.hold,sets:e.sets.map(s=>({v:+s.v||0,ok:s.ok}))}))};st.base={d:add(r.d,2),i:(r.i+1)%4};st.run=null;tm=null},
aw:()=>{const x=parseFloat($("wv").value),d=$("wd").value||today;if(!x)return false;st.w=st.w.filter(e=>e.d!=d);st.w.push({d,v:x})},dw:v=>{st.w=st.w.filter(e=>e.d!=v)},
am2:()=>{const m={d:today},k=[["t","m1"],["c","m2"],["b","m3"],["cu","m4"],["tt","m5"],["bf","m6"]];k.forEach(x=>{const v=parseFloat($(x[1]).value);if(v)m[x[0]]=v});if(Object.keys(m).length<2)return false;st.mens=st.mens.filter(e=>e.d!=today);st.mens.push(m);if(m.t)st.prof.taille=m.t},
wa:v=>{st.water[nd]=(st.water[nd]||0)+ +v},
am:()=>{const n=$("mn").value.trim(),k=parseFloat($("mk").value);if(!n||isNaN(k))return false;(st.meals[nd]=st.meals[nd]||[]).push({c:+$("mc").value,n,k,p:+$("mp").value||0,g:+$("mg").value||0,l:+$("ml").value||0})},
dm:v=>st.meals[nd].splice(+v,1),fv:v=>{const m=st.meals[nd][+v];if(!st.fav.some(f=>f.n==m.n))st.fav.push({n:m.n,k:m.k,p:m.p,g:m.g,l:m.l})},af:v=>{(st.meals[nd]=st.meals[nd]||[]).push(Object.assign({c:+$("mc").value},st.fav[+v]))},
sl:v=>{const[n,i]=v.split("|"),s=st.sk[n];if(s.l!=+i){s.l=+i;s.pd=today}},sb:v=>{const x=parseFloat($("sv_"+v.replace(/ /g,"_")).value);if(!x)return false;const s=st.sk[v];s.h.push({d:today,v:x});s.best=Math.max(s.best,x)},
sp:()=>{const p=st.prof;p.age=+$("pa").value||p.age;p.taille=+$("pt").value||p.taille;p.poids0=+$("pw0").value||p.poids0;st.goal=parseFloat($("pg").value)||null;p.sexe=$("ps").value;p.obj=$("po").value;p.act=+$("pc").value;p.niveau=$("pn").value},
sg:()=>{const k=+$("gk").value;if(k)st.ng={k,p:+$("gp").value||0,g:+$("gg").value||0,l:+$("gl").value||0}},ag:()=>{st.ng=null},
ex:()=>{const b=new Blob([JSON.stringify(st)],{type:"application/json"}),l=document.createElement("a");l.href=URL.createObjectURL(b);l.download="suivi-calisthenie.json";l.click();return false}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a;if(A[a]&&A[a](b.dataset.v)!==false){sv();R()}});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset.r;if(!d||!st.run)return;const r=st.run;if(d=="rpe"){r.rpe=+t.value;$("rv").textContent=t.value}else if(d=="com")r.com=t.value;else if(d=="pain")r.pain=t.value;else{const[a,b]=d.split(":").map(Number);r.ex[a].sets[b].v=t.value;r.cur=a}sv()});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.c=="fx"){fx=t.value;R()}if(t.dataset.c=="th"){st.theme=t.value;sv();R()}if(t.id=="imp"&&t.files[0]){const r=new FileReader();r.onload=()=>{try{Object.assign(st,JSON.parse(r.result));sv();R()}catch(x){alert("Fichier invalide")}};r.readAsText(t.files[0])}});
setInterval(()=>{const e=$("tmv");if(!e||!tm)return;if(tm.m=="r"){const s=Math.ceil((tm.end-Date.now())/1e3);if(s<=0){e.textContent="Repos terminé";try{navigator.vibrate&&navigator.vibrate(300)}catch(x){}tm=null}else e.textContent="Repos "+fmt(s)}else e.textContent="Maintien "+fmt(Math.round((Date.now()-tm.t0)/1e3))},300);
if(!st.prof.sexe)tab="pf";R();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

</script></body></html>
